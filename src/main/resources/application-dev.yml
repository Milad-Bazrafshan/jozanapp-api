spring:
  jpa:
    hibernate:
      ddl-auto: create
  config:
    activate:
      on-profile: dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  security:
    expose-password-reset-token: ${EXPOSE_PASSWORD_RESET_TOKEN:true}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
