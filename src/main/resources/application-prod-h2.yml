# Production روی سرور با H2 فایل‌محور — داده در volume نگه‌داری می‌شود.
# اجرا: SPRING_PROFILES_ACTIVE=prod-h2
spring:
  config:
    activate:
      on-profile: prod-h2

  datasource:
    driver-class-name: org.h2.Driver
    url: "jdbc:h2:file:${H2_DATA_DIR:/data/jozan}/jozan-school;AUTO_SERVER=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS school"
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    create-schemas: true
    default-schema: school
    schemas: school

server:
  servlet:
    session:
      cookie:
        secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.jozanapp.ir,https://admin.jozanapp.ir,https://instructor.jozanapp.ir}
  storage:
    root: ${STORAGE_ROOT:${H2_DATA_DIR:/data/jozan}/files}
  security:
    expose-password-reset-token: false
    cookie:
      secure: true
      same-site: Strict
  bootstrap:
    enabled: true
    tenant-name: همیار آموزش جوزان
    tenant-slug: jozan
  demo-data:
    enabled: true
  zohal:
    enabled: ${ZOHAL_ENABLED:false}
